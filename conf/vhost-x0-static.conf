<VirtualHost *:80>
	ServerName x0-static.x0.localnet
	ServerAdmin admin@x0.localnet
	DocumentRoot /var/www/vhosts/x0-static
	LogLevel warn

	<Directory /var/www/vhosts/x0-static>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		# Allow POST requests so the x0 JS loader can fetch static JSON data files
		AllowMethods GET POST HEAD OPTIONS
	</Directory>

	# Serve JSON metadata files with correct content type
	<FilesMatch "\.json$">
		Header set Content-Type "application/json; charset=UTF-8"
	</FilesMatch>

	ErrorLog /var/log/apache2/x0-static.error.log
	CustomLog /var/log/apache2/x0-static.access.log vhost_combined
</VirtualHost>
